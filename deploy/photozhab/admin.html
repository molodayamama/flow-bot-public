<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photozhab · Operator Cockpit</title>
  <style>
:root{
  color-scheme:dark;
  --bg:#0f1210;--nav:#0a0c0b;--panel:#151916;--panel2:#1b211d;--line:rgba(244,241,232,.14);
  --ink:#f4f1e8;--muted:#b7b4aa;--faint:#727067;--lime:#c8f25f;--cyan:#54d7d6;
  --coral:#ff7b6d;--warn:#ffc24b;--shadow:0 16px 40px rgba(0,0,0,.44);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
#app{display:flex;height:100vh;overflow:hidden}.sidebar{width:236px;flex:0 0 236px;background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:18px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--lime),var(--cyan));color:#101210;display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand span{font-size:11px;color:var(--faint)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:3px;overflow:auto}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:8px;padding:9px 10px;font-weight:650;display:flex;gap:9px;align-items:center}.nav button:hover,.nav button.active{background:var(--panel2);color:var(--ink)}
.status{margin-top:auto;padding:14px;border-top:1px solid var(--line);display:grid;gap:8px}.status-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;background:var(--panel2);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}.dot.ok{background:var(--lime);box-shadow:0 0 8px rgba(200,242,95,.55)}.dot.bad{background:var(--coral)}.dot.wait{background:var(--warn)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.offline{display:none;background:rgba(255,123,109,.12);border-bottom:1px solid rgba(255,123,109,.35);color:var(--coral);padding:9px 24px;font-size:13px}.offline.show{display:block}.topbar{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(15,18,16,.82)}.title{font-size:19px;font-weight:850}.subtitle{font-size:13px;color:var(--faint);margin-top:2px}.content{padding:22px 24px;overflow:auto}
.tab{display:none}.tab.active{display:block}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.section-title{margin:20px 0 10px;color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:850}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.card h3{margin:0 0 4px;font-size:15px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.metric{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px}.metric .k{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:850}.metric .v{font-family:var(--mono);font-size:28px;font-weight:850;margin-top:5px}.metric .s{font-size:12px;color:var(--muted);margin-top:2px}.lime{color:var(--lime)}.cyan{color:var(--cyan)}.coral{color:var(--coral)}.warn{color:var(--warn)}
.table-wrap{border:1px solid var(--line);border-radius:8px;overflow:auto;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:820px}th{background:#0b0d0c;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 12px}td{border-top:1px solid rgba(244,241,232,.08);padding:11px 12px;font-size:13px;vertical-align:top}tr:hover td{background:rgba(255,255,255,.025)}.mono{font-family:var(--mono);font-size:12px}.muted{color:var(--muted)}.faint{color:var(--faint)}.nowrap{white-space:nowrap}
.badge{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;font-size:11px;font-weight:800;border:1px solid var(--line);white-space:nowrap}.b-ok{color:var(--lime);background:rgba(200,242,95,.1);border-color:rgba(200,242,95,.3)}.b-warn{color:var(--warn);background:rgba(255,194,75,.1);border-color:rgba(255,194,75,.3)}.b-bad{color:var(--coral);background:rgba(255,123,109,.1);border-color:rgba(255,123,109,.3)}.b-info{color:var(--cyan);background:rgba(84,215,214,.09);border-color:rgba(84,215,214,.25)}.b-muted{color:var(--faint);background:var(--panel2)}
.btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:8px 11px;font-weight:800;font-size:12px}.btn:hover{background:var(--panel2);color:var(--ink)}.btn.primary{background:var(--ink);color:#111;border-color:var(--ink)}.btn.danger{color:var(--coral);border-color:rgba(255,123,109,.35)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.small{padding:5px 8px}.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px}.seg button{border:0;border-radius:6px;background:transparent;color:var(--muted);padding:6px 9px;font-weight:800;font-size:12px}.seg button.active{background:var(--panel2);color:var(--ink)}
.field{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 10px;outline:none}.field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(84,215,214,.12)}textarea.field{width:100%;min-height:104px;font-family:var(--mono);font-size:12px;line-height:1.45;resize:vertical}input.field{min-width:120px}.toggle{display:inline-flex;align-items:center;gap:7px}.toggle input{accent-color:#aee84b}
.log{display:grid;gap:6px}.log-row{display:grid;grid-template-columns:48px auto 90px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(244,241,232,.07)}.log-row:last-child{border-bottom:0}.log-time{font-family:var(--mono);font-size:12px;color:var(--faint)}.log-text{font-size:13px}.empty{padding:22px;color:var(--faint);text-align:center}.errorbox{border:1px solid rgba(255,123,109,.3);background:rgba(255,123,109,.08);color:var(--coral);padding:14px;border-radius:8px}.quick{display:flex;gap:8px;flex-wrap:wrap}.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px}.side-card{position:sticky;top:0;align-self:start}.drawer{position:fixed;top:0;right:-520px;width:min(520px,100vw);height:100vh;background:#111512;border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:50;transition:right .18s ease;overflow:auto}.drawer.open{right:0}.drawer-head{position:sticky;top:0;background:#111512;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;gap:12px}.drawer-body{padding:16px}.stack{display:grid;gap:12px}.copy-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.copy-list{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:70vh;background:var(--panel)}.copy-key{padding:10px 12px;border-bottom:1px solid rgba(244,241,232,.08);cursor:pointer}.copy-key.active{background:var(--panel2)}.copy-key b{font-family:var(--mono);font-size:12px}.preview{background:#17221d;border:1px solid rgba(84,215,214,.22);border-radius:8px;padding:12px;line-height:1.45;font-size:14px;white-space:pre-wrap}.price-row{display:grid;grid-template-columns:1.3fr 110px 110px 130px 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(244,241,232,.08)}.price-row:last-child{border-bottom:0}.diff{font-family:var(--mono);font-size:12px}.toastbox{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:90}.toast{padding:11px 13px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px}.toast.ok{color:var(--lime)}.toast.bad{color:var(--coral)}
@media(max-width:900px){.sidebar{width:70px;flex-basis:70px}.brand div:last-child,.nav span.label,.status .status-text{display:none}.split,.copy-layout{grid-template-columns:1fr}.content{padding:16px}.price-row{grid-template-columns:1fr 90px}.price-row .hide-sm{display:none}}
  </style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">P</div><div><b>Photozhab</b><span>operator cockpit</span></div></div>
    <nav class="nav" id="nav">
      <button class="active" data-tab="ops">🟢 <span class="label">Ops Cockpit</span></button>
      <button data-tab="accounts">🤖 <span class="label">Accounts</span></button>
      <button data-tab="support">🛟 <span class="label">Support</span></button>
      <button data-tab="users">👤 <span class="label">Users</span></button>
      <button data-tab="revenue">💳 <span class="label">Revenue</span></button>
      <button data-tab="prices">💰 <span class="label">Prices</span></button>
      <button data-tab="copy">💬 <span class="label">UX Copy</span></button>
      <button data-tab="settings">⚙ <span class="label">Settings</span></button>
    </nav>
    <div class="status">
      <div class="status-pill"><span class="dot wait" id="status-dot"></span><span class="status-text" id="status-text">Проверка API</span></div>
      <a class="btn small" href="/">← сайт</a>
    </div>
  </aside>
  <main class="main">
    <div class="offline" id="offline">API недоступен. Данные не подменяются демо-значениями, write-действия заблокированы. Не ответили: <span id="offline-list">-</span></div>
    <header class="topbar">
      <div><div class="title" id="page-title">Ops Cockpit</div><div class="subtitle" id="page-sub">Жив ли бот и способен ли он генерировать прямо сейчас</div></div>
      <button class="btn" id="refresh">↻ Обновить</button>
    </header>
    <section class="content">
      <div id="tab-ops" class="tab active"></div>
      <div id="tab-accounts" class="tab"></div>
      <div id="tab-support" class="tab"></div>
      <div id="tab-users" class="tab"></div>
      <div id="tab-revenue" class="tab"></div>
      <div id="tab-prices" class="tab"></div>
      <div id="tab-copy" class="tab"></div>
      <div id="tab-settings" class="tab"></div>
    </section>
  </main>
</div>
<aside class="drawer" id="drawer"><div class="drawer-head"><b id="drawer-title">Detail</b><button class="btn small" onclick="closeDrawer()">✕</button></div><div class="drawer-body" id="drawer-body"></div></aside>
<div class="toastbox" id="toasts"></div>

<script>
const API_BASE = '/api/admin';
const state = { tab:'ops', offline:false, failed:new Set(), copyKind:'message', copyItems:[], selectedCopy:null, supportStatus:'open', usersPage:1, usersQ:'' };
const tabs = {
  ops:['Ops Cockpit','Жив ли бот и способен ли он генерировать прямо сейчас',loadOps],
  accounts:['Accounts Cockpit','Производственная мощность Flow/browser аккаунтов',loadAccounts],
  support:['Support Cockpit','Тикеты, пользовательский контекст, платежи и последние генерации',loadSupport],
  users:['Users Debug','Кто платил, у кого проблемы, баланс и последние действия',()=>loadUsers(1)],
  revenue:['Revenue Cockpit','Деньги, платежи, каналы и рефералка',loadRevenue],
  prices:['Financial Console','Цены, overrides и защита от случайных изменений',loadPrices],
  copy:['UX Copy Console','Тексты, кнопки, preview и placeholder validation',loadCopy],
  settings:['Settings & Flags','Флаги фич и параметры с подтверждением опасных изменений',loadSettings],
};

document.getElementById('nav').addEventListener('click', e=>{
  const btn=e.target.closest('button[data-tab]'); if(!btn) return; switchTab(btn.dataset.tab);
});
document.getElementById('refresh').addEventListener('click',()=>tabs[state.tab][2]());
setInterval(checkPing,30000);
checkPing(); loadOps();

function switchTab(name){
  state.tab=name;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab').forEach(p=>p.classList.toggle('active',p.id===`tab-${name}`));
  document.getElementById('page-title').textContent=tabs[name][0];
  document.getElementById('page-sub').textContent=tabs[name][1];
  tabs[name][2]();
}

async function api(method,path,body,{write=false}={}){
  if(write && state.offline){ toast('bad','API недоступен, запись заблокирована'); return null; }
  try{
    const r=await fetch(API_BASE+path,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(8000)});
    if(!r.ok){
      if(method==='GET' || r.status>=500){ state.failed.add(path); setOffline(true); }
      return {__error:true,status:r.status,body:await safeJson(r)};
    }
    state.failed.delete(path); if(state.failed.size===0) setOffline(false); return await r.json();
  }catch(_){ state.failed.add(path); setOffline(true); return null; }
}
async function safeJson(r){ try{return await r.json()}catch(_){return null} }
function setOffline(v){
  state.offline=v;
  document.getElementById('offline').classList.toggle('show',v);
  document.getElementById('offline-list').textContent=[...state.failed].join(', ') || '-';
  document.getElementById('status-dot').className='dot '+(v?'bad':'ok');
  document.getElementById('status-text').textContent=v?'API недоступен':'API online';
  document.querySelectorAll('[data-write]').forEach(b=>b.disabled=v);
}
async function checkPing(){ const r=await api('GET','/ping'); if(r&&!r.__error) setOffline(false); }

function html(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){return Number(n??0).toLocaleString('ru-RU')}
function rub(n){return Number(n||0).toFixed(0)+'₽'}
function pct(x){return x==null?'нет данных':(Number(x)*100).toFixed(1)+'%'}
function when(s){return s?String(s).slice(0,16):'—'}
function badge(text,type='muted'){return `<span class="badge b-${type}">${html(text)}</span>`}
function toast(type,msg){const el=document.createElement('div');el.className='toast '+(type==='bad'?'bad':'ok');el.textContent=msg;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),3200)}
function tabEl(name=state.tab){return document.getElementById(`tab-${name}`)}
function errorView(msg){return `<div class="errorbox">${html(msg)}</div>`}
function empty(msg){return `<div class="empty">${html(msg)}</div>`}
function confirmDanger(msg){return window.confirm(msg)}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function openDrawer(title,body){document.getElementById('drawer-title').textContent=title;document.getElementById('drawer-body').innerHTML=body;document.getElementById('drawer').classList.add('open')}

async function loadOps(){
  const el=tabEl('ops'); el.innerHTML=empty('Загрузка операционного состояния...');
  const data=await api('GET','/ops');
  if(!data||data.__error){ el.innerHTML=errorView('API недоступен: невозможно оценить, способен ли бот генерировать.'); return; }
  const h=data.health||{}, a=data.accounts||{}, st=data.stats||{};
  const fail1=pct(h.jobs_1h?.fail_rate), fail24=pct(h.jobs_24h?.fail_rate);
  const serviceOk = a.active>0 && (h.jobs_1h?.fail_rate==null || h.jobs_1h.fail_rate<0.5);
  el.innerHTML=`
    <div class="grid">
      <div class="metric"><div class="k">API / bot</div><div class="v ${serviceOk?'lime':'coral'}">${serviceOk?'LIVE':'RISK'}</div><div class="s">admin API отвечает, capacity ниже</div></div>
      <div class="metric"><div class="k">Аккаунты</div><div class="v cyan">${fmt(a.active)}/${fmt(a.total)}</div><div class="s">${fmt(a.video_active)} видео-ready · ${fmt(a.disabled)} disabled</div></div>
      <div class="metric"><div class="k">Cooldown</div><div class="v ${a.cooldown?'warn':'lime'}">${fmt(a.cooldown)}</div><div class="s">аккаунтов ждут восстановления</div></div>
      <div class="metric"><div class="k">Jobs 1h</div><div class="v">${fmt(h.jobs_1h?.success)}/${fmt(h.jobs_1h?.total)}</div><div class="s">fail rate ${fail1}</div></div>
      <div class="metric"><div class="k">Jobs 24h</div><div class="v">${fmt(h.jobs_24h?.success)}/${fmt(h.jobs_24h?.total)}</div><div class="s">fail rate ${fail24}</div></div>
      <div class="metric"><div class="k">Support open</div><div class="v ${h.open_tickets?'warn':'lime'}">${fmt(h.open_tickets)}</div><div class="s">тикетов требуют внимания</div></div>
    </div>
    <div class="section-title">Быстрые действия</div>
    <div class="quick">
      <button class="btn primary" onclick="switchTab('accounts')">Перейти к Accounts</button>
      <button class="btn" onclick="switchTab('support')">Перейти к Support</button>
      <button class="btn" onclick="switchTab('settings')">Feature flags</button>
      <button class="btn" onclick="switchTab('prices')">Цены</button>
    </div>
    <div class="section-title">Критичные ошибки</div>
    ${renderCritical(h.critical_errors||[])}
    <div class="grid two">
      <div><div class="section-title">Последние jobs</div>${renderJobs(h.last_jobs||[])}</div>
      <div><div class="section-title">Последние события</div>${renderEvents(data.events||[])}</div>
    </div>
    <div class="section-title">Деньги ниже операционного статуса</div>
    <div class="grid">
      <div class="metric"><div class="k">Выручка сегодня</div><div class="v lime">${rub(st.revenue_today_rub)}</div><div class="s">paid transactions</div></div>
      <div class="metric"><div class="k">Выручка всего</div><div class="v cyan">${rub(st.revenue_total_rub)}</div><div class="s">за всё время</div></div>
      <div class="metric"><div class="k">Кредиты сегодня</div><div class="v">${fmt(st.credits_sold)}</div><div class="s">списано flow_jobs</div></div>
    </div>`;
}
function renderCritical(rows){
  if(!rows.length) return `<div class="card"><p class="lime">Последних critical backend errors нет.</p></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>Время</th><th>Аккаунт</th><th>Операция</th><th>Модель</th><th>Reason</th><th>User</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${when(r.created_at)}</td><td class="mono cyan">${html(r.account_id||'—')}</td><td>${html(r.operation_type||'—')}</td><td class="mono">${html(r.model||'—')}</td><td class="coral">${html(r.error_type||'—')}</td><td class="mono">${html(r.user_id||'—')}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderJobs(rows){
  if(!rows.length) return empty('Jobs пока нет');
  return `<div class="table-wrap"><table><thead><tr><th>Время</th><th>Acc</th><th>Op</th><th>Status</th><th>User</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${when(r.created_at)}</td><td class="mono cyan">${html(r.account_id||'—')}</td><td>${html(r.operation_type||'—')}</td><td>${jobBadge(r.status)}</td><td class="mono">${html(r.user_id||'—')}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderEvents(rows){
  if(!rows.length) return empty('Событий нет');
  return `<div class="card log">${rows.slice(0,16).map(e=>`<div class="log-row"><span class="log-time">${html(e.time)}</span><span class="log-text">${html(e.text)}</span><span>${badge(e.chip||'event',e.color==='coral'?'bad':e.color==='warn'?'warn':e.color==='lime'?'ok':'info')}</span></div>`).join('')}</div>`;
}
function jobBadge(s){return s==='success'?badge('success','ok'):s==='fail'||s==='error'?badge(s,'bad'):badge(s||'—','muted')}

async function loadAccounts(){
  const el=tabEl('accounts'); el.innerHTML=empty('Загрузка аккаунтов...');
  const accs=await api('GET','/accounts');
  if(!accs||accs.__error){el.innerHTML=errorView('Accounts API недоступен. Управление аккаунтами заблокировано.');return}
  const active=accs.filter(a=>!a.disabled && !(a.cooldown_left>0));
  el.innerHTML=`
    <div class="grid">
      <div class="metric"><div class="k">Доступны</div><div class="v cyan">${fmt(active.length)}/${fmt(accs.length)}</div><div class="s">не disabled и не cooldown</div></div>
      <div class="metric"><div class="k">Видео-ready</div><div class="v">${fmt(active.filter(a=>a.video_allowed).length)}</div><div class="s">можно брать video jobs</div></div>
      <div class="metric"><div class="k">Cooldown</div><div class="v warn">${fmt(accs.filter(a=>a.cooldown_left>0).length)}</div><div class="s">временно исключены</div></div>
    </div>
    <div class="section-title">Production capacity</div>
    <div class="table-wrap"><table><thead><tr><th>Аккаунт</th><th>Health</th><th>Enabled</th><th>Video</th><th>Jobs</th><th>Failures</th><th>Last activity</th><th>Last error</th><th>Actions</th></tr></thead><tbody>
    ${accs.map(a=>`<tr>
      <td><div class="mono cyan">${html(a.id)}</div><div class="faint">assigned users: ${fmt(a.users||0)}</div></td>
      <td>${accountHealth(a)}</td>
      <td>${a.disabled?badge('disabled','bad'):badge('enabled','ok')}</td>
      <td>${a.video_allowed?badge('video on','info'):badge('image only','muted')}</td>
      <td class="mono">${fmt(a.jobs_total||0)} <span class="lime">✓${fmt(a.jobs_success||0)}</span> <span class="coral">✗${fmt(a.jobs_fail||0)}</span></td>

let priceItems=[];
async function loadPrices(){
  const el=tabEl('prices'); el.innerHTML=empty('Загрузка цен...');
  const data=await api('GET','/config/prices?meta=1');
  if(!data||data.__error){el.innerHTML=errorView('Prices API недоступен. Сохранение заблокировано.');return}
  priceItems=data.items||[];
  const groups=[...new Set(priceItems.map(i=>i.group))];
  el.innerHTML=`<div class="card"><p class="warn">${html(data.warning||'Изменение цены применяется к новым операциям сразу.')}</p></div>${groups.map(g=>`<div class="section-title">${html(g)}</div><div class="card">${priceItems.filter(i=>i.group===g).map(priceRow).join('')}</div>`).join('')}<div class="quick"><button data-write class="btn primary" onclick="savePrices()">Сохранить цены</button></div>`;
  bindPriceInputs(); setOffline(state.offline);
}
function priceRow(i){return `<div class="price-row" data-key="${html(i.key)}" data-default="${i.default}"><div><b>${html(i.label)}</b><div class="mono faint">${html(i.key)} ${i.override?badge('override','warn'):badge('default','muted')}</div></div><div class="hide-sm mono">default ${fmt(i.default)}</div><div class="hide-sm mono">current ${fmt(i.value)}</div><input class="field" type="number" min="${i.free_allowed?0:1}" step="1" value="${i.value}" data-price="${html(i.key)}"><div class="diff faint" id="diff-${html(i.key)}">без изменений</div></div>`}
function bindPriceInputs(){document.querySelectorAll('[data-price]').forEach(inp=>inp.addEventListener('input',()=>{const row=inp.closest('.price-row');const d=Number(row.dataset.default),v=Number(inp.value);document.getElementById('diff-'+inp.dataset.price).innerHTML=v===d?'без override':`${fmt(d)} → <span class="${v>d?'warn':'cyan'}">${fmt(v)}</span>`}))}
async function savePrices(){
  const payload={}, diffs=[]; let bad=null;
  priceItems.forEach(i=>{const el=document.querySelector(`[data-price="${CSS.escape(i.key)}"]`);const v=Number(el.value);if(v<0||(!i.free_allowed&&v===0)) bad=i.key;if(v!==Number(i.default)){payload[i.key]=v;diffs.push(`${i.label}: ${i.value} → ${v}`)}});
  if(bad){toast('bad',`Некорректная цена: ${bad}`);return}
  if(!confirmDanger(`Сохранить изменения цен?\n\n${diffs.length?diffs.join('\n'):'Все overrides будут сброшены к default.'}\n\nПрименяется к новым операциям сразу.`))return;
  const r=await api('POST','/config/prices',payload,{write:true});
  if(r&&!r.__error){toast('ok','Цены сохранены');loadPrices()}else toast('bad',r?.body?.errors?.[0]?.error||'Ошибка сохранения цен');
}

function renderCopy(){
  const el=tabEl('copy'); const groups=[...new Set(state.copyItems.map(i=>i.group))]; const sel=state.copyItems.find(i=>i.key===state.selectedCopy);
  el.innerHTML=`<div class="toolbar"><div class="seg"><button class="${state.copyKind==='message'?'active':''}" onclick="state.copyKind='message';loadCopy()">Messages</button><button class="${state.copyKind==='label'?'active':''}" onclick="state.copyKind='label';loadCopy()">Labels</button></div><input class="field" id="copy-search" placeholder="search key/text" oninput="filterCopy()"><button data-write class="btn primary" onclick="saveCopy()">Сохранить changed overrides</button></div>

function copyList(groups){return groups.map(g=>`<div class="section-title" style="padding-left:12px">${html(g)}</div>${state.copyItems.filter(i=>i.group===g).map(i=>`<div class="copy-key ${i.key===state.selectedCopy?'active':''}" data-search="${html((i.key+' '+i.value).toLowerCase())}" onclick="state.selectedCopy='${html(i.key)}';renderCopy()"><b>${html(i.key)}</b><div class="faint">${i.override?'override':'default'} ${i.warnings?.length?'· '+i.warnings.join(', '):''}</div></div>`).join('')}`).join('')}
function copyEditor(i){return `<div class="card"><h3>${html(i.key)}</h3><p>${html(i.group)} · placeholders: ${i.placeholders?.length?i.placeholders.map(p=>'{'+p+'}').join(', '):'none'} ${i.editable?'':badge('read only','bad')}</p></div>${i.editable?`<textarea class="field" data-copy="${html(i.key)}" oninput="updateCopy('${html(i.key)}',this.value)">${html(i.value)}</textarea><div class="section-title">Telegram preview</div><div class="preview" id="copy-preview">${tgPreview(i.value)}</div><div class="section-title">Validation</div><div id="copy-validation">${copyValidation(i)}</div><div class="quick" style="margin-top:12px"><button class="btn" onclick="resetCopy('${html(i.key)}')">Reset to default</button></div>`:empty('Этот ключ не строка в default MESSAGES и не редактируется из админки.')}`}
function updateCopy(key,value){const i=state.copyItems.find(x=>x.key===key);i.value=value;document.getElementById('copy-preview').innerHTML=tgPreview(value);document.getElementById('copy-validation').innerHTML=copyValidation(i)}
function resetCopy(key){const i=state.copyItems.find(x=>x.key===key);if(i&&i.default!=null){i.value=i.default;renderCopy()}}
function copyValidation(i){let errs=[];const placeholders=[...String(i.value).matchAll(/\{([a-zA-Z_][\w]*)\}/g)].map(m=>m[1]);(i.placeholders||[]).forEach(p=>{if(!placeholders.includes(p))errs.push(`missing {${p}}`)});if(/\d+\s*(кр|кредит)/i.test(i.value))errs.push('manual price text warning');if(state.copyKind==='label'&&i.value.length>64)errs.push('button text too long');return errs.length?errs.map(e=>badge(e,'warn')).join(' '):badge('ok','ok')}
function filterCopy(){const q=document.getElementById('copy-search').value.toLowerCase();document.querySelectorAll('.copy-key').forEach(k=>k.style.display=k.dataset.search.includes(q)?'block':'none')}
function tgPreview(s){return html(s).replace(/\n/g,'<br>').replace(/&lt;b&gt;(.*?)&lt;\/b&gt;/g,'<b>$1</b>').replace(/&lt;i&gt;(.*?)&lt;\/i&gt;/g,'<i>$1</i>').replace(/&lt;code&gt;(.*?)&lt;\/code&gt;/g,'<code>$1</code>')}
async function saveCopy(){
  const payload={}; let errors=[];
  state.copyItems.filter(i=>i.editable).forEach(i=>{if(i.default==null||i.value!==i.default)payload[i.key]=i.value;const text=copyValidation(i);if(text.includes('missing'))errors.push(i.key)});
  if(errors.length){toast('bad','Потеряны обязательные placeholders: '+errors.join(', '));return}
  const hard=state.copyItems.filter(i=>/\d+\s*(кр|кредит)/i.test(i.value)); if(hard.length&&!confirmDanger('В copy найдены ручные цены. Продолжить?'))return;
  const r=await api('POST',state.copyKind==='label'?'/config/labels':'/config/messages',payload,{write:true});
  if(r&&!r.__error){toast('ok','Copy сохранена');loadCopy()}else toast('bad',r?.body?.errors?.[0]?.error||'Ошибка сохранения copy');
}

async function loadSettings(){
  const el=tabEl('settings'); el.innerHTML=empty('Загрузка настроек...');
  const [cfg,flags]=await Promise.all([api('GET','/config/settings'),api('GET','/config/flags')]);
  if(!cfg||cfg.__error||!flags||flags.__error){el.innerHTML=errorView('Settings API недоступен.');return}
  el.innerHTML=`<div class="grid two"><div class="card"><h3>Параметры</h3>${numField('starter_credits','Стартовые кредиты',cfg.starter_credits,0)}${numField('cooldown_sec','Cooldown аккаунта, сек',cfg.cooldown_sec,30)}${numField('max_failures','Отказов до cooldown',cfg.max_failures,1)}</div><div class="card"><h3>Audit</h3><p>Write endpoints пишут best-effort event <span class="mono">admin_action</span>: action, old/new, timestamp/source через request headers.</p></div></div><div class="section-title">Feature flags</div><div class="stack">${Object.entries(flags).map(([k,f])=>flagRow(k,f)).join('')}</div><div class="quick" style="margin-top:14px"><button data-write class="btn primary" onclick="saveSettings()">Сохранить настройки и флаги</button></div>`;
  setOffline(state.offline);
}
function numField(id,label,val,min){return `<label style="display:block;margin-top:12px"><div class="faint" style="font-size:12px">${html(label)}</div><input class="field" type="number" min="${min}" id="set-${id}" value="${html(val)}"></label>`}
function flagRow(k,f){return `<div class="card" data-flagrow="${html(k)}"><div style="display:flex;justify-content:space-between;gap:12px"><div><h3>${html(f.label)} ${f.dangerous?badge('dangerous','bad'):badge('normal','muted')}</h3><p>${html(f.impact||f.desc)}</p><p class="mono faint">${html(k)} · ${html(f.desc)} · default ${f.default}</p></div><label class="toggle"><input type="checkbox" data-flag="${html(k)}" ${f.value?'checked':''} data-danger="${f.dangerous?'1':'0'}" data-original="${f.value?'1':'0'}"> on</label></div></div>`}
async function saveSettings(){
  const settings={starter_credits:Number(document.getElementById('set-starter_credits').value),cooldown_sec:Number(document.getElementById('set-cooldown_sec').value),max_failures:Number(document.getElementById('set-max_failures').value)};
  const flags={};let dangerous=[];
  document.querySelectorAll('[data-flag]').forEach(el=>{flags[el.dataset.flag]=el.checked;if(el.dataset.danger==='1'&&((el.checked?'1':'0')!==el.dataset.original))dangerous.push(el.dataset.flag)});
  if(dangerous.length&&!confirmDanger('Dangerous flags изменятся: '+dangerous.join(', ')+'\nЭто влияет на деньги/генерацию/видео. Продолжить?'))return;
  const [r1,r2]=await Promise.all([api('POST','/config/settings',settings,{write:true}),api('POST','/config/flags',flags,{write:true})]);
  if((r1&&!r1.__error)||(r2&&!r2.__error)){toast('ok','Настройки сохранены');loadSettings()}else toast('bad','Ошибка сохранения настроек');
}
</script>
