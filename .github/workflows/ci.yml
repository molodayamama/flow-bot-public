name: offline-validation

on:
  push:
    branches: [main, refactor]
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Import-only placeholder; no API request is made by the offline suite.
      TELEGRAM_TOKEN: "123456789:TEST"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python tools/check_tracked_secrets.py
      - run: python -m compileall -q -x "google_profile|\.git" .
      - run: python -m unittest discover -s tests -p "test_*.py"
